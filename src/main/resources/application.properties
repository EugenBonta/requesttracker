spring.application.name=requesttracker

spring.mongodb.uri=mongodb://mongo:27017/requesttrackerbd
logging.level.org.mongodb.driver=DEBUG
server.port=8080

# Expose actuator endpoints for health monitoring
management.endpoints.web.exposure.include=health,info,metrics
# Show detailed health information (change to 'when_authorized' in production with security)
management.endpoint.health.show-details=always
