name: CI-CD Spring Boot

on:
  push:
    branches: ["main"]

# 🔐 IMPORTANT: permisiuni pentru GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 3. Build Spring Boot app
      - name: Build Maven
        run: mvn clean package -DskipTests

      # 4. Login GHCR
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ghcr.io/eugenbonta/requesttracker:latest .

      # 6. Push Docker image
      - name: Push Docker image
        run: |
          docker push ghcr.io/eugenbonta/requesttracker:latest

      # 7. Deploy to Kubernetes via SSH
      - name: Deploy to Kubernetes (k3s VM)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            kubectl rollout restart deployment spring-app -n app
            kubectl rollout status deployment spring-app -n app