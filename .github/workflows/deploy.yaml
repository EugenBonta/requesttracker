name: CI-CD Spring Boot

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Maven
        run: mvn clean package -DskipTests

      # 🔑 lowercase owner fix
      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 🏷 image tag
      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      # 🔐 login GHCR (IMPORTANT: GITHUB_TOKEN, nu alt token)
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 🐳 build image
      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ env.OWNER }}/requesttracker:${{ env.TAG }} .

      # 📤 push image
      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ env.OWNER }}/requesttracker:${{ env.TAG }}

      # 🚀 deploy on VM
      - name: Deploy to Kubernetes (k3s VM)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            kubectl set image deployment/spring-app \
              spring-app=ghcr.io/${{ env.OWNER }}/requesttracker:${{ env.TAG }} -n app

            kubectl rollout status deployment/spring-app -n app