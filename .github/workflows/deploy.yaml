name: CI-CD Spring Boot

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Maven
        run: mvn clean package -DskipTests

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          ddocker build -t ghcr.io/eugenbonta/requesttracker:latest .

      - name: Push Docker image
        run: |
          ddocker build -t ghcr.io/eugenbonta/requesttracker:latest .

      - name: Deploy to Kubernetes (k3s VM)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            kubectl rollout restart deployment spring-app -n app
            kubectl rollout status deployment spring-app -n app